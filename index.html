<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Terapkan tema SEBELUM render untuk menghindari flash (FOUC).
      // Default: dark. Light dipakai jika user memilihnya, atau OS di-set light.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || (!t && window.matchMedia("(prefers-color-scheme: light)").matches)) {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Primary SEO -->
    <title>Muhammad Daffa Aldyananta — Full Stack Developer</title>
